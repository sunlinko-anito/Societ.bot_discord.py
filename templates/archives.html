<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Societ - Archives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2>Project Archives (Games)</h2>
        <a href="/" class="btn btn-secondary mb-3">Back to Home</a>
        <ul>
            {% for game in games %}
                <li><strong>{{ game[1] }}</strong> - Status: {{ game[3] }}</li>
            {% else %}
                <li>No projects archived yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
