<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Societ - Home</title>
    <!-- โหลด Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- โหลดไฟล์ CSS หลักของเรา -->
    <link rel="stylesheet" href="static/css/style.css">
    
    <style>
        /* สไตล์พิเศษเฉพาะหน้า Home ให้ดูพรีเมียมขึ้น (Glassmorphism) */
        .glass-panel {
            background: rgba(20, 25, 45, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        
        .title-glow {
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.8), 0 0 20px rgba(123, 44, 191, 0.6);
        }

        /* ปรับสีปุ่มให้เข้ากับบริบทการใช้งาน (เขียนทับสีหลักชั่วคราว) */
        .btn-admin { background: linear-gradient(45deg, #e63946, #ffb703) !important; }
        .btn-logout { background: linear-gradient(45deg, #6c757d, #343a40) !important; box-shadow: 0 0 20px rgba(108, 117, 125, 0.5) !important; }
        .btn-login { background: linear-gradient(45deg, #2a9d8f, #e9c46a) !important; box-shadow: 0 0 20px rgba(42, 157, 143, 0.5) !important; }
    </style>
</head>
<!-- เอา bg-dark ออก เพื่อให้พื้นหลัง CSS ของเราแสดงผล -->
<body class="text-white"> 

    <!-- คอนเทนเนอร์สำหรับใส่ดาวกระพริบและดาวตก -->
    <div class="night-sky" id="sky"></div>

    <!-- จัดกึ่งกลางหน้าจอแบบ 100% ของความสูง -->
    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">
        
        <!-- กล่องกระจก -->
        <div class="glass-panel text-center w-100" style="max-width: 800px;">
            <h1 class="display-4 fw-bold title-glow mb-3">Welcome to Societ Project</h1>
            <p class="lead mb-5 text-light">Your central hub for operations.</p>
            
            <!-- เมนูหลัก -->
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-5">
                <a href="/operatives" class="magic-btn">Operatives</a>
                <a href="/store" class="magic-btn">Store</a>
                <a href="/archives" class="magic-btn">Archives</a>
            </div>
            
            <hr class="border-secondary opacity-50 w-75 mx-auto mb-4">
            
            <!-- ส่วนเข้าสู่ระบบ (Jinja Template) -->
            <div>
                {% if user %}
                    <p class="fs-5 mb-4">Logged in as: <span class="fw-bold text-info">{{ user.username }}</span></p>
                    <div class="d-flex flex-wrap justify-content-center gap-3">
                        <a href="/admin" class="magic-btn btn-admin">Admin Panel</a>
                        <a href="/logout" class="magic-btn btn-logout">Logout</a>
                    </div>
                {% else %}
                    <a href="/login" class="magic-btn btn-login">Login with Discord (Admin Only)</a>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Script สำหรับสร้างดาวและเสียงปุ่ม -->
    <script>
        const sky = document.getElementById('sky');

        // 1. สร้างดาวกระพริบปกติ
        for (let i = 0; i < 70; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 1.5 + 0.5) + 's'; 
            sky.appendChild(star);
        }

        // 2. สร้างดาวแฉก (Cross-stars) แบบในรูป ประมาณ 5 ดวง
        for (let j = 0; j < 5; j++) {
            let bigStar = document.createElement('div');
            bigStar.className = 'cross-star';
            bigStar.style.left = Math.random() * 90 + 5 + 'vw';
            bigStar.style.top = Math.random() * 90 + 5 + 'vh';
            bigStar.style.animationDuration = (Math.random() * 2 + 1) + 's';
            sky.appendChild(bigStar);
        }

        // 3. ฟังก์ชันสร้างดาวตก
        setInterval(() => {
            let shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = (Math.random() * 100 + 50) + 'vw';
            shootingStar.style.top = (Math.random() * 50 - 50) + 'vh';
            sky.appendChild(shootingStar);
            setTimeout(() => shootingStar.remove(), 2000);
        }, 3000); 

        // 4. ระบบเล่นเสียงปุ่มแล้วค่อยย้ายหน้า
        const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3'); 
        document.querySelectorAll('.magic-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.tagName === 'A' && this.getAttribute('href')) {
                    e.preventDefault(); 
                    clickSound.currentTime = 0; 
                    clickSound.play();
                    this.classList.add('clicked');
                    setTimeout(() => {
                        window.location.href = this.getAttribute('href'); 
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
