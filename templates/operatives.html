<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Societ - Operatives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2>Operatives Data</h2>
        <a href="/" class="btn btn-secondary mb-3">Back to Home</a>
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>Nickname</th>
                    <th>Position</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
                {% for emp in employees %}
                <tr>
                    <td>{{ emp[3] }}</td> <!-- column index อิงจาก DB -->
                    <td>{{ emp[4] }}</td>
                    <td>{{ emp[8] }}</td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-center">No operatives found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
