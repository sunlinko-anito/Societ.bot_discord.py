<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Societ - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css"> <!-- เชื่อม CSS -->
</head>
<body class="text-white"> <!-- เอา bg-danger ออกเพื่อโชว์ดาว -->
    <div class="night-sky" id="sky"></div> <!-- พื้นหลังดาว -->
    <div class="container mt-5">
        <h1>Admin Dashboard</h1>
        <p>Welcome Admin: {{ user.username }}</p>
        <hr>
        <p>You have access to this page because you have the Admin Role in the Discord Server.</p>
        <!-- ใส่เครื่องมือจัดการ DB ตรงนี้ในอนาคต -->
        <a href="/" class="magic-btn mt-3">Back to Home</a> <!-- เปลี่ยนปุ่ม -->
    </div>
    <!-- Script สำหรับสร้างดาวและเสียง -->
    <script>
        // 1. สร้างดาวกระพริบ
        const sky = document.getElementById('sky');
        for (let i = 0; i < 70; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 1.5 + 0.5) + 's'; 
            sky.appendChild(star);
        }

        // 2. สร้างดาวตก
        setInterval(() => {
            let shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = (Math.random() * 100 + 50) + 'vw';
            shootingStar.style.top = (Math.random() * 50 - 50) + 'vh';
            sky.appendChild(shootingStar);
            setTimeout(() => shootingStar.remove(), 2000);
        }, 3000); 

        // 3. ระบบเล่นเสียงปุ่มแล้วค่อยย้ายหน้า (ถ้าเป็นปุ่มลิ้งก์)
        const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3'); 
        document.querySelectorAll('.magic-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.tagName === 'A' && this.getAttribute('href')) {
                    e.preventDefault(); // เบรกการย้ายหน้าไว้ก่อน
                    clickSound.currentTime = 0; 
                    clickSound.play();
                    this.classList.add('clicked');
                    setTimeout(() => {
                        window.location.href = this.getAttribute('href'); // ย้ายหน้าหลังจากเล่นอนิเมชั่นเสร็จ
                    }, 300);
                }
            });
        });
    </script>
    <script>

        setInterval(() => { let shootingStar = document.createElement('div'); shootingStar.className = 'shooting-star'; shootingStar.style.left = (Math.random() * 100 + 50) + 'vw'; shootingStar.style.top = (Math.random() * 50 - 50) + 'vh'; sky.appendChild(shootingStar); setTimeout(() => shootingStar.remove(), 2000); }, 3000); 
        const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3'); document.querySelectorAll('.magic-btn').forEach(btn => { btn.addEventListener('click', function(e) { if (this.tagName === 'A' && this.getAttribute('href')) { e.preventDefault(); clickSound.currentTime = 0; clickSound.play(); this.classList.add('clicked'); setTimeout(() => { window.location.href = this.getAttribute('href'); }, 300); } }); });
    </script>
</body>
</html>
